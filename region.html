<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>권역 안내 | 2026 중학생을 위한 고교학점제 박람회</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<!-- 권역 히어로 -->
<section class="region-hero" id="region-hero">
  <div class="container inner" id="region-hero-inner"></div>
</section>

<!-- 특강 시간표 -->
<section class="block" id="lecture">
  <div class="container">
    <div class="sec-head">
      <span class="tag">STEP 1 · 한 걸음</span>
      <h2>특강 운영 시간</h2>
      <p>주제1(고교학점제·학교생활기록 안내)과 주제2(고입 전형·직업계고 안내)가 함께 진행됩니다.</p>
    </div>
    <div class="timetable" id="lecture-table"></div>
    <p class="tt-note" id="lecture-note"></p>
  </div>
</section>

<!-- 신청 -->
<section class="block alt" id="apply">
  <div class="container">
    <div class="sec-head">
      <span class="tag">APPLY</span>
      <h2 id="apply-title">참가 신청</h2>
      <p>특강과 1:1 상담은 온라인 사전 신청으로 운영됩니다.</p>
    </div>
    <div class="apply-grid" id="apply-grid"></div>
  </div>
</section>

<!-- 참가교 -->
<section class="block" id="schools">
  <div class="container">
    <div class="sec-head">
      <span class="tag">STEP 3 · 세 걸음</span>
      <h2 id="schools-title">참가 학교</h2>
      <p>학교 이름을 누르면 학교소개자료를 확인할 수 있어요.</p>
    </div>
    <div class="school-toolbar">
      <input type="search" id="school-search" placeholder="학교 이름으로 검색 (예: 강원과학고)">
      <div class="type-chips" id="type-chips"></div>
    </div>
    <div id="school-list"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="data/site-data.js"></script>
<script src="js/common.js"></script>
<script src="js/region.js"></script>
</body>
</html>
