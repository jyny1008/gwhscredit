<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="강원특별자치도교육청 상징">
  <!-- 모두가 빛나는 강원교육 BI 재현: 원을 그리며 도는 네 사람 + 빛나는 별 -->
  <g stroke-linecap="round" fill="none">
    <!-- 노란 궤적(별을 향한 스우시) -->
    <path d="M 22 38 A 42 42 0 0 1 82 21" stroke="#F2BA44" stroke-width="5"/>
    <path d="M 99 34 A 42 42 0 0 1 103 62" stroke="#F2BA44" stroke-width="4" opacity=".85"/>
    <!-- 사람 몸통(호) -->
    <path d="M 20 78 A 42 42 0 0 1 16 51" stroke="#50AFE1" stroke-width="9"/>
    <path d="M 51 103 A 42 42 0 0 1 30 88" stroke="#616EAE" stroke-width="9"/>
    <path d="M 90 92 A 42 42 0 0 1 65 103" stroke="#E47E3A" stroke-width="9"/>
    <path d="M 103 74 A 42 42 0 0 1 98 84" stroke="#DE659F" stroke-width="9"/>
  </g>
  <!-- 머리 -->
  <circle cx="27" cy="42" r="6.5" fill="#50AFE1"/>
  <circle cx="26" cy="94" r="6.5" fill="#616EAE"/>
  <circle cx="63" cy="110" r="6.5" fill="#E47E3A"/>
  <circle cx="104" cy="90" r="6.5" fill="#DE659F"/>
  <!-- 팔(뻗은 동작) -->
  <g stroke-linecap="round" fill="none">
    <path d="M 20 55 Q 30 60 38 55" stroke="#50AFE1" stroke-width="6"/>
    <path d="M 36 92 Q 42 84 52 84" stroke="#616EAE" stroke-width="6"/>
    <path d="M 74 97 Q 78 88 88 86" stroke="#E47E3A" stroke-width="6"/>
    <path d="M 96 72 Q 88 66 80 68" stroke="#DE659F" stroke-width="6"/>
  </g>
  <!-- 빛나는 별 -->
  <path d="M 90 6 L 93.2 18.8 L 106 22 L 93.2 25.2 L 90 38 L 86.8 25.2 L 74 22 L 86.8 18.8 Z" fill="#F2BA44"/>
  <path d="M 99 30 L 100.4 35 L 105.4 36.4 L 100.4 37.8 L 99 42.8 L 97.6 37.8 L 92.6 36.4 L 97.6 35 Z" fill="#F2BA44" opacity=".9"/>
</svg>
